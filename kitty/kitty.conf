# font_family DMMono
window_padding_width 4
font_size 17

# BEGIN_KITTY_THEME
# Kanagawa_dragon
include current-theme.conf
# END_KITTY_THEME

symbol_map U+F500-U+FD46 Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5 Symbols Nerd Font Mono

disable_ligatures cursor

# BEGIN_KITTY_FONTS
font_family      family='DM Mono' postscript_name=DMMono-Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
